<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrathamSmart Settings</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#d9dee7; --accent:#1f6feb; --err:#c4320a; --ok:#137333; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#9aa3b2; --line:#2e3644; --accent:#4c8dff; --err:#ff7a59; --ok:#4cc38a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:20px; margin:4px 0 16px; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  label { display:block; margin:10px 0 4px; font-size:13px; color:var(--muted); }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--text); font-size:15px; }
  button { padding:9px 14px; border:0; border-radius:7px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button.link { background:none; color:var(--err); padding:6px 0; font-size:13px; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:13px; min-height:1em; margin-top:3px; }
  .msg { margin-top:10px; font-size:14px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--err); }
  .row { display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="row"><h1>PrathamSmart Settings</h1><button id="logout" class="link hidden">Logout</button></div>

  <section id="loginBox" class="card">
    <h2>Login</h2>
    <label for="u">Username</label><input id="u" autocomplete="username">
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
    <div style="margin-top:12px"><button id="loginBtn">Login</button></div>
    <div id="loginMsg" class="msg bad"></div>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <label for="dev">Device</label>
      <select id="dev"></select>
    </section>

    <section class="card">
      <h2>Assistant</h2>
      <label for="assistant_name">Assistant ka naam</label><input id="assistant_name" placeholder="Pratham">
      <div class="err" data-err="assistant_name"></div>
      <label for="language">Bhasha</label><select id="language"></select>
      <div class="err" data-err="language"></div>
    </section>

    <section class="card">
      <h2>AI</h2>
      <label for="ai_provider">Provider</label>
      <select id="ai_provider"><option value="">Server default</option><option value="groq">Groq</option><option value="openai">OpenAI</option></select>
      <div class="err" data-err="ai_provider"></div>
      <div id="aiMore">
        <label for="ai_model">Model</label><select id="ai_model"></select>
        <div class="err" data-err="ai_model"></div>
        <label for="ai_api_key">Apni API key (optional)</label><input id="ai_api_key" type="password" autocomplete="new-password">
        <div class="hint">Apni key na ho to server ki key se sirf saste model chalenge.</div>
        <div class="err" data-err="ai_api_key"></div>
        <button class="link hidden" data-clear="ai">AI key hatao</button>
      </div>
    </section>

    <section class="card">
      <h2>Gmail</h2>
      <label for="gmail_address">Gmail address</label><input id="gmail_address" type="email" autocomplete="off">
      <div class="err" data-err="gmail_address"></div>
      <label for="gmail_app_password">App Password</label><input id="gmail_app_password" type="password" autocomplete="new-password">
      <div class="hint">Google Account → Security → 2-Step Verification → App passwords (16 akshar)</div>
      <div class="err" data-err="gmail_app_password"></div>
      <label for="mail_sender_name">Mail mein aapka naam</label><input id="mail_sender_name">
      <button class="link hidden" data-clear="gmail">Gmail hatao</button>
    </section>

    <section class="card">
      <h2>WhatsApp (CallMeBot)</h2>
      <label for="whatsapp_phone">Number</label><input id="whatsapp_phone" placeholder="+919876543210">
      <div class="err" data-err="whatsapp_phone"></div>
      <label for="whatsapp_apikey">CallMeBot apikey</label><input id="whatsapp_apikey" type="password" autocomplete="new-password">
      <div class="err" data-err="whatsapp_apikey"></div>
      <button class="link hidden" data-clear="whatsapp">WhatsApp hatao</button>
    </section>

    <section class="card">
      <h2>MyPratham</h2>
      <label for="pratham_user_token">User token</label><input id="pratham_user_token" type="password" autocomplete="new-password">
      <button class="link hidden" data-clear="pratham">Token hatao</button>
    </section>

    <button id="save">Save</button>
    <div id="msg" class="msg"></div>
  </div>
</main>
<script>
(function () {
  var SECRETS = ["ai_api_key", "gmail_app_password", "whatsapp_apikey", "pratham_user_token"];
  var PLAIN = ["assistant_name", "language", "ai_provider", "ai_model", "gmail_address", "mail_sender_name", "whatsapp_phone"];
  var CLEAR_KEY = { ai: "ai_api_key", gmail: "gmail_app_password", whatsapp: "whatsapp_apikey", pratham: "pratham_user_token" };
  var $ = function (id) { return document.getElementById(id); };
  var token = null, cfg = null;
  try { token = sessionStorage.getItem("ps_token"); } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token) opts.headers.Authorization = "Token " + token;
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
    });
  }
  function show(loggedIn) {
    $("loginBox").classList.toggle("hidden", loggedIn);
    $("app").classList.toggle("hidden", !loggedIn);
    $("logout").classList.toggle("hidden", !loggedIn);
  }
  function setMsg(t, ok) { var m = $("msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "bad"); }
  function clearErrs() { document.querySelectorAll("[data-err]").forEach(function (e) { e.textContent = ""; }); }

  function fillModels() {
    var p = $("ai_provider").value, sel = $("ai_model"), cur = cfg && cfg.ai_model;
    $("aiMore").classList.toggle("hidden", !p);
    sel.innerHTML = '<option value="">Default</option>';
    ((cfg && cfg.ai_models && cfg.ai_models[p]) || []).forEach(function (m) {
      var o = document.createElement("option"); o.value = m; o.textContent = m; sel.appendChild(o);
    });
    sel.value = (cfg && cfg.ai_provider === p) ? (cur || "") : "";
  }

  function render(d) {
    cfg = d;
    var lang = $("language"); lang.innerHTML = "";
    Object.keys(d.languages || {}).forEach(function (c) {
      var o = document.createElement("option"); o.value = c; o.textContent = d.languages[c]; lang.appendChild(o);
    });
    PLAIN.forEach(function (k) { if (k !== "ai_model" && d[k] !== undefined) $(k).value = d[k] || ""; });
    fillModels();
    SECRETS.forEach(function (k) {
      $(k).value = "";
      $(k).placeholder = d[k] ? "Set hai (" + d[k] + ") — badalna ho to hi likhein" : "";
    });
    document.querySelectorAll("[data-clear]").forEach(function (b) {
      b.classList.toggle("hidden", !d[CLEAR_KEY[b.dataset.clear]]);
    });
  }

  function loadSettings() {
    clearErrs(); setMsg("", true);
    var id = $("dev").value;
    if (!id) return;
    api("/api/devices/" + encodeURIComponent(id) + "/settings/").then(function (r) {
      if (r.ok) render(r.d); else setMsg(r.d.error || r.d.detail || "Load nahi hua", false);
    });
  }

  function loadDevices() {
    api("/api/my-devices/").then(function (r) {
      if (r.status === 401) { logout(); return; }
      var sel = $("dev"); sel.innerHTML = "";
      (r.d.devices || []).forEach(function (x) {
        var o = document.createElement("option"); o.value = x.plant_id;
        o.textContent = x.plant_id + (x.online ? "  (online)" : ""); sel.appendChild(o);
      });
      if (!sel.options.length) { setMsg("Aapke account mein koi device nahi hai", false); return; }
      show(true); loadSettings();
    });
  }

  function save(clear) {
    clearErrs();
    var body = { clear: clear || [] };
    PLAIN.forEach(function (k) { body[k] = $(k).value.trim(); });
    if (!body.ai_provider) body.ai_model = "";
    SECRETS.forEach(function (k) { var v = $(k).value.trim(); if (v) body[k] = v; });
    $("save").disabled = true; setMsg("Jaanch rahe hain...", true);
    api("/api/devices/" + encodeURIComponent($("dev").value) + "/settings/", { method: "POST", body: JSON.stringify(body) })
      .then(function (r) {
        if (r.ok) { render(r.d); setMsg("Save ho gaya. Device par 30 second mein lag jayega.", true); return; }
        var e = r.d.errors || {};
        Object.keys(e).forEach(function (k) { var el = document.querySelector('[data-err="' + k + '"]'); if (el) el.textContent = e[k]; });
        setMsg(r.d.error || "Kuch galat hai, laal likha dekhein", false);
      })
      .catch(function () { setMsg("Server se connect nahi hua", false); })
      .finally(function () { $("save").disabled = false; });
  }

  function logout() {
    token = null; try { sessionStorage.removeItem("ps_token"); } catch (e) {}
    show(false);
  }

  $("loginBtn").onclick = function () {
    $("loginMsg").textContent = "";
    api("/api/settings-login/", { method: "POST", body: JSON.stringify({ username: $("u").value.trim(), password: $("p").value }) })
      .then(function (r) {
        if (!r.ok || !r.d.token) { $("loginMsg").textContent = "Username ya password galat"; return; }
        token = r.d.token; try { sessionStorage.setItem("ps_token", token); } catch (e) {}
        $("p").value = ""; loadDevices();
      });
  };
  $("p").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });
  $("logout").onclick = logout;
  $("dev").onchange = loadSettings;
  $("ai_provider").onchange = fillModels;
  $("save").onclick = function () { save(); };
  document.querySelectorAll("[data-clear]").forEach(function (b) {
    b.onclick = function () { if (confirm("Pakka hatana hai?")) save([b.dataset.clear]); };
  });

  if (token) loadDevices(); else show(false);
})();
</script>
</body>
</html>
