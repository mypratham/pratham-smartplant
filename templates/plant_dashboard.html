    <script>

        function api(path, options = {}) {

            options.headers = options.headers || {};

            options.headers["Content-Type"] = "application/json";

            return fetch(path, options)
                .then(async r => {

                    let d = {};

                    try {
                        d = await r.json();
                    } catch (e) { }

                    if (!r.ok) {
                        throw new Error(
                            d.message ||
                            d.reply ||
                            "Backend error " + r.status
                        );
                    }

                    return d;

                });

        }


        function addActionCard(id) {

            document.getElementById(id)
                .insertAdjacentHTML(
                    "beforeend",

                    `<div class="action-item">

<div class="row">
<b>Action Item</b>

<button type="button"
class="btn-del"
onclick="this.parentElement.parentElement.remove()">
Delete
</button>

</div>

Type:

<select class="act-type">
<option value="track">
DFPlayer Track
</option>

<option value="tts">
Text to Speech
</option>

</select>

Value / Text:

<input class="act-val" value="1">

Display Label:

<input class="act-txt" value="Tulsi">

Expression:

<input class="act-expr" value="happy">

</div>`
                );

        }


        function collectTouch(id) {

            let a = [];

            document
                .querySelectorAll("#" + id + " .action-item")
                .forEach(c => {

                    a.push({

                        type:
                            c.querySelector(".act-type").value,

                        value:
                            c.querySelector(".act-val").value,

                        text:
                            c.querySelector(".act-txt").value,

                        expr:
                            c.querySelector(".act-expr").value

                    });

                });

            return a;

        }


        function saveTouch() {

            let data = {

                single:
                    collectTouch("single-touch-list"),

                double:
                    collectTouch("double-touch-list")

            };


            api(
                "/save-touch",
                {
                    method: "POST",
                    body: JSON.stringify(data)
                }
            )
                .then(() => {

                    alert(
                        "Touch Configurations Saved!"
                    );

                })
                .catch(e => alert(e.message));

        }


        function addReminder() {

            let d = new Date();

            document

        function saveReminders() {

            let a = [];

            document
                .querySelectorAll(".rem-card")

                        start_month:

        function restartESP() {

            if (
                !confirm("Restart Device?")
            ) return;


            api(
                "/restart",
                {
                    method: "POST"
                }
            )
                .then(() => {

                    alert("Restarting...");

                })

        function powerToggle() {

            api(

                }
            )
                .then(d => {

                .catch(e => alert(e.message));

        function sendAIChat() {

            let i =
                document.getElementById("ai-msg");

            let msg = i.value.trim();

            if (!msg) return;


            let b =
                document.getElementById(
                    "ai-chat-box"
                );


            b.innerHTML +=
                '<div style="background:#080d16;padding:10px;border-radius:10px;margin-top:8px;text-align:right"><b>You:</b> '
                +
                msg
                +
                '</div>';


            b.innerHTML +=
                '<div id="ai-thinking" style="background:#131d2e;padding:10px;border-radius:10px;margin-top:8px;color:#d97706;border:1px solid #283548"><b>Plant:</b> Thinking...</div>';


            i.value = "";

            b.scrollTop = b.scrollHeight;


            api(
                "/ai-chat",
                {
                    method: "POST",
                    body: JSON.stringify({
                        message: msg
                    })
                }
            )
                .then(d => {

                    if (!d.success) {

                        throw new Error(
                            d.reply ||
                            "AI failed"
                        );

                    }

                    pollAI();

                })
                .catch(e => {

                    let x =
                        document.getElementById(
                            "ai-thinking"
                        );

                    if (x) {

                        x.innerHTML =
                            '<b style="color:#ef4444">Error:</b> '
                            +
                            e.message;

                    }

                });

        }


        function pollAI() {

            let n = 0;


            let t = setInterval(() => {

                api(
                    "/ai-status"
                )
                    .then(d => {

                        if (d.reply) {

                            clearInterval(t);


                            let x =
                                document.getElementById(
                                    "ai-thinking"
                                );


                            if (x) {

                                x.outerHTML =
                                    '<div style="background:#131d2e;padding:10px;border-radius:10px;margin-top:8px;color:#06b6d4;border:1px solid #283548"><b>Plant:</b> '
                                    +
                                    d.reply
                                    +
                                    '</div>';

                            }

                        }

                    })
                    .catch(() => { });


                n++;


                if (n >= 30) {

                    clearInterval(t);

                    let x =
                        document.getElementById(
                            "ai-thinking"
                        );

                    if (x) {

                        x.innerHTML =
                            '<b style="color:#d97706">Plant:</b> Taking longer.';

                    }

                }

            }, 500);

        }


        document.addEventListener(
            "DOMContentLoaded",
            () => {

                let input =
                    document.getElementById(
                        "ai-msg"
                    );

                if (input) {

                    input.addEventListener(
                        "keydown",
                        e => {

                            if (e.key === "Enter") {

                                e.preventDefault();

                                sendAIChat();

                            }

                        }
                    );

                }

            }
        );

    </script>
